name: CI

on:
  push:
    branches:
      - main
      - gpt6-handoff-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused handoff regression tests
        run: >-
          node --test
          test/blacklist.test.mjs
          test/blacklist_export.test.mjs
          test/portable_browser_profile.test.mjs
      - name: Build production bundle
        run: npm run build
