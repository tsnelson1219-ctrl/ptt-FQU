name: CI

on:
  push:
    branches:
      - main
      - gpt6-handoff-fixes
      - fix/reconnect-blacklist-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused handoff regression tests
        run: >-
          node --test
          test/blacklist.test.mjs
          test/reconnect.test.mjs
          test/blacklist_export.test.mjs
          test/quick_boards_input.test.mjs
          test/portable_origin.test.mjs
          test/portable_browser_profile.test.mjs
      - name: Build production bundle
        run: npm run build

  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows Portable package
        run: npm run build:portable
      - name: Read portable package version
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Scan Windows Portable with Microsoft Defender
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          $portablePath = (Resolve-Path "work/PTT-FQU-$env:PACKAGE_VERSION-portable").Path
          Update-MpSignature
          Start-MpScan -ScanType CustomScan -ScanPath $portablePath
          Start-Sleep -Seconds 5
          $detections = Get-MpThreatDetection | Where-Object {
            (($_.Resources -join "`n") -like "*$portablePath*")
          }
          if ($detections) {
            $detections | Format-List *
            throw "Microsoft Defender detected a threat in the portable package. Artifact upload stopped."
          }
          $status = Get-MpComputerStatus
          @"
          PTT-FQU $env:PACKAGE_VERSION Portable
          Microsoft Defender: scan completed; no detections in this package.
          Signature version: $($status.AntivirusSignatureVersion)
          Scan time (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))
          Source commit: $env:GITHUB_SHA
          "@ | Set-Content -Path (Join-Path $portablePath "安全掃描結果.txt") -Encoding utf8
      - name: Upload Windows Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTT-FQU-${{ steps.package-version.outputs.version }}-portable
          path: work/
          if-no-files-found: error
          retention-days: 90
